# TBG 2.0 Rust workspace. Three crates; boundaries in docs/ARCHITECTURE.md.
#   tbg-core   deterministic rules + content + protocol (no I/O, no graphics)
#   tbg-client Bevy browser client (WASM/WebGL2)
#   tbg-server authoritative Axum/Tokio server (never depends on Bevy)

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[profile.dev]
# Line tables are enough for panics; full debug info made target/ 12 GB.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
