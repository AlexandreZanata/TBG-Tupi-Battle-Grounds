# tbg-client: Bevy browser client (WASM/WebGL2). Renders and sends
# PlayerIntentions; never decides outcomes.

[package]
name = "tbg-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "tbg-client"
path = "src/main.rs"

[dependencies]
# Headless app core until Phase 1 enables the "3d" and "ui" features.
bevy = { version = "0.20", default-features = false }
tbg-core = { path = "../tbg-core" }
