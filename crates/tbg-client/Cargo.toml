# tbg-client: Bevy browser application (scaffolding only in Phase 00).
# Rendering/presentation responsibilities; authoritative logic stays in tbg-core.

[package]
name = "tbg-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "tbg-client"
path = "src/main.rs"

[dependencies]
# bevy 0.20: game framework + ECS (verified on crates.io 2026-10-27).
# Phase 00 enables only the headless application core: default features
# (render, audio, windowing) need OS libraries absent from minimal
# environments and arrive with the Phase 01 arena prototype instead.
bevy = { version = "0.20", default-features = false }
tbg-core = { path = "../tbg-core" }
tbg-protocol = { path = "../tbg-protocol" }
