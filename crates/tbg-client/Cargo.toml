# tbg-client: Bevy browser client (WASM/WebGL2). Renders and sends
# PlayerIntentions; never decides outcomes.

[package]
name = "tbg-client"
version = "0.1.4-colossus.1"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[[bin]]
name = "tbg-client"
path = "src/main.rs"

[features]
# Opt-in packaged UI captures, runtime and synthetic vault acceptance;
# inactive without explicit flags, no automatic test actions in ordinary launches.
ui-acceptance = []

[dependencies]
# Bevy renderer + UI (WebGL2). Explicit features instead of the "3d"/"ui"
# collections: drops gamepads (gilrs needs libudev), glTF, animation,
# post-processing, and the embedded tonemapping LUTs, which shrinks the WASM.
bevy = { version = "0.20", default-features = false, features = [
    # app core
    "std", "async_executor", "bevy_asset", "bevy_log", "bevy_state", "reflect_auto_register",
    # platform: window, input, browser canvas (P41: default_font dropped, the
    # i18n plugin embeds a Latin-1 Noto Sans subset at AssetId::default instead)
    "bevy_winit", "bevy_window", "multi_threaded", "webgl2", "x11", "wayland",
    # 3D rendering
    "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light", "bevy_camera",
    "bevy_color", "bevy_mesh", "bevy_image", "bevy_shader",
    # PNG encodes opt-in visual acceptance captures with the existing Bevy image dependency.
    "png", "bevy_material",
    # UI and text (taps are hit-tested in ui/input.rs, no picking needed)
    "bevy_ui", "bevy_ui_render", "bevy_text", "bevy_input_focus", "webp",
    "bevy_audio", "wav",
] }
# WebSocket client with the same API on wasm and native (P1). Reason: RTT ping.
ewebsock = { version = "0.8", features = ["tls"] }
tbg-core = { path = "../tbg-core", features = ["training"] }
# Shared JSON catalogs and bounded HTTP response decoding for native/web UI.
serde_json = "1"
# Callback HTTP works on native and WASM without adding an async runtime.
ehttp = "0.7"
# Compare release versions using SemVer, including native prerelease identifiers.
semver = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# P73: format persisted UTC timestamps in the native system time zone using the already locked library.
jiff = "=0.2.38"
# OS-standard user data directory for native preferences and account credentials.
directories = "6"
# Retained system clipboard ownership for copying keys/links and pasting input.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
# Open public ranking/download pages using the OS default browser.
open = "5"
# Additional Bevy log layer writes native diagnostic logs to the user data directory.
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# D-97: explicit OS vault provider API; never store refresh in preferences.
keyring-core = "=1.0.1"
# D-97: ehttp follows redirects/buffers responses; auth needs bounded, nonredirecting requests.
ureq = "=3.5.0"
# D-97: fallible native device/operation IDs and registration retry proof.
getrandom = "0.3"
# D-97: canonical credential origin boundaries and redirect rejection.
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# D-97: real Secret Service with Rust crypto and bundled D-Bus, no plaintext fallback.
dbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
# D-97: current user's Credential Manager with explicit Local persistence.
windows-native-keyring-store = "=1.1.0"

[build-dependencies]
# Build-time only: parse assets/i18n/*.json in build.rs (P41, D2).
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Page URL params, session token in localStorage, room/challenge links,
# the native share sheet, URL cleanup, and the account text-entry overlay.
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Navigator", "MediaQueryList", "Clipboard", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "History"] }
# P11: JS closures for the overlay listeners (companion of web-sys).
wasm-bindgen = "0.2"
