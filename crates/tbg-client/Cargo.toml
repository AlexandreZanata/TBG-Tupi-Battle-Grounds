# tbg-client: Bevy browser client (WASM/WebGL2). Renders and sends
# PlayerIntentions; never decides outcomes.

[package]
name = "tbg-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "tbg-client"
path = "src/main.rs"

[dependencies]
# Bevy renderer + UI for the browser spike (P1). Reason: WebGL2 arena + overlay.
bevy = { version = "0.20", default-features = false, features = ["3d", "ui"] }
# WebSocket client with the same API on wasm and native (P1). Reason: RTT ping.
ewebsock = "0.8"
tbg-core = { path = "../tbg-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Page URL query params (?stress=, ?server=) on wasm32 (P1). Reason: config + server URL.
web-sys = { version = "0.3", features = ["Window", "Location"] }
