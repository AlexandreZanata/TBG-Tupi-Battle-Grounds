<!doctype html>
<html lang="en">
<head>
  <script>
  // P41 language resolver: ?lang=, then tbg.lang, then the browser, else en.
  // Runs before anything else; Rust and i18n.js read documentElement.lang.
  (function () {
    try {
      var asked = new URLSearchParams(location.search).get('lang');
      var code = null;
      if (asked) code = /^pt/i.test(asked) ? 'pt-BR' : (/^en/i.test(asked) ? 'en' : null);
      if (!code) { try { code = localStorage.getItem('tbg.lang'); } catch (e) {} }
      if (code !== 'pt-BR' && code !== 'en') {
        var list = (navigator.languages && navigator.languages.length)
          ? navigator.languages : (navigator.language ? [navigator.language] : []);
        code = 'en';
        for (var i = 0; i < list.length; i++) {
          if (/^pt/i.test(list[i])) { code = 'pt-BR'; break; }
          if (/^en/i.test(list[i])) { code = 'en'; break; }
        }
      }
      document.documentElement.lang = code;
      // Start the catalog fetch early; i18n.js awaits the same URL (cache hit).
      var preload = document.createElement('link');
      preload.rel = 'preload'; preload.as = 'fetch'; preload.crossOrigin = 'anonymous';
      preload.href = 'assets/i18n/' + code + '.json';
      document.head.appendChild(preload);
    } catch (e) { document.documentElement.lang = 'en'; }
  })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Tupi Battle Grounds</title>
  <link rel="icon" href="assets/branding/tbg.ico?v=fortress-2" sizes="any">
  <link rel="icon" type="image/png" href="assets/branding/tbg-icon-512.png?v=fortress-2" sizes="512x512">
  <link rel="apple-touch-icon" href="assets/branding/apple-touch-icon.png?v=fortress-2">
  <link data-trunk rel="rust" data-bin="tbg-client" data-wasm-opt="z" />
  <link data-trunk rel="copy-dir" href="assets" />
  <link data-trunk rel="copy-dir" href="ranking" />
  <link data-trunk rel="copy-dir" href="diagnostics" />
  <script src="diagnostics/measure.js"></script>
  <!-- Hashed by Trunk so every deploy changes the URL (no stale CDN/browser cache). -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2b36; touch-action: none; }
    canvas#bevy { display: block; width: 100%; height: 100%; outline: none; }
  </style>
</head>
<body>
<canvas id="bevy"></canvas>
<!-- P72: the browser renders the native (Bevy) interface; the HTML lobby,
     HUD, ranking overlay and account form were removed (owner, 2026-11-01). -->

</footer>
</body>
</html>
