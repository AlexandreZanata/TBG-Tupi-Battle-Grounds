# tbg-assets: asset definitions, schemas, and validation contracts.
# No heavy generation runtimes here (no Blender/ML deps); offline
# generation lives in tools/asset-factory/.

[package]
name = "tbg-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tbg_assets"
path = "src/lib.rs"

[dependencies]
# serde/serde_json: schema-typed manifests for content/ and GLB gates.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
