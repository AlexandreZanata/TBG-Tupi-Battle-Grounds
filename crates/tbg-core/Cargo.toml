# tbg-core: deterministic rules, content tables, bot, and wire protocol.
# Shared by tbg-client (WASM) and tbg-server (native).
# No graphics, database, network I/O, or wall-clock dependencies.

[package]
name = "tbg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tbg_core"
path = "src/lib.rs"

[features]
# Offline balance lab only (D-33): unit duels without the Shop. Never
# enabled by tbg-server or tbg-client (contract C10).
lab = []
# Local Troops training laboratory only (P62, D-80): enabled by tbg-client,
# never by tbg-server. Inert unless a `TrainingSession` is constructed.
training = []
# Native benchmark allocator counters only; no simulation or protocol changes.
bench-alloc = ["bench-profile"]
# Opt-in operation counts for isolated native benchmarks, disabled online.
bench-profile = []

[dependencies]
# Derives for state, views, and protocol messages.
serde = { version = "1", features = ["derive"] }
# Compact binary wire format and the state hash input.
postcard = { version = "1", default-features = false, features = ["alloc"] }
