# tbg-server: authoritative native game server (Axum + Tokio WebSocket).
# Must never depend on Bevy or any graphics stack.

[package]
name = "tbg-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "tbg-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tbg-core = { path = "../tbg-core" }
