# tbg-server: authoritative native game server (Axum + Tokio WebSocket).
# Must never depend on Bevy or any graphics stack.

[package]
name = "tbg-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tbg_server"
path = "src/lib.rs"

[[bin]]
name = "tbg-server"
path = "src/main.rs"

[[bin]]
name = "tbg-bots"
path = "src/bin/tbg-bots.rs"

[dependencies]
# WebSocket upgrade and routing.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tbg-core = { path = "../tbg-core" }
# /metrics JSON.
serde_json = "1"
# Session tokens and match seeds from the OS.
getrandom = "0.3"
# Bot client (tbg-bots, tests); same tungstenite version axum 0.8.9 uses.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Splitting WebSocket streams in the bot client.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Optional static file serving for LAN tests (TBG_STATIC_DIR).
tower-http = { version = "0.6", features = ["fs"] }
# Match records (P5); bundled SQLite, no system library.
rusqlite = { version = "0.41", features = ["bundled"] }
# Structured logs.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
