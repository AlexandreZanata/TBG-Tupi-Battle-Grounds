# tbg-protocol: versioned network message contracts (placeholder in Phase 00).
# Shared serialization types only: no game logic, no transport code.

[package]
name = "tbg-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tbg_protocol"
path = "src/lib.rs"

[dependencies]
# serde: message (de)serialization for WebSocket JSON frames (Phase 04).
serde = { version = "1", features = ["derive"] }
