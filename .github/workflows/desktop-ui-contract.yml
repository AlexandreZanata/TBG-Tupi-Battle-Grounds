name: Desktop UI contract
on:
  pull_request:
    paths:
      - 'crates/tbg-client/**'
      - 'docs/ui/**'
      - 'scripts/check-desktop-ui.py'
      - 'scripts/test-desktop-ui.py'
      - '.github/workflows/desktop-ui-contract.yml'
  push:
    branches: [main]
    paths:
      - 'crates/tbg-client/**'
      - 'docs/ui/**'
      - 'scripts/check-desktop-ui.py'
      - 'scripts/test-desktop-ui.py'
permissions:
  contents: read
jobs:
  source-routing:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install Pillow==13.0.0
      - run: python3 scripts/check-desktop-ui.py
      - run: python3 scripts/test-desktop-ui.py
      - run: node crates/tbg-client/tests/auth-session.test.cjs
