name: Public static sites release candidate

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: static-release-main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # No pull-request build, fork, failed CI or stale main commit can publish.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deployable: ${{ steps.scope.outputs.deployable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select public frontend inputs
        id: scope
        run: python3 scripts/static-release-changes.py

  build:
    needs: [scope]
    if: needs.scope.outputs.deployable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TBG_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate public site contracts and prepare the source-bound payload
        run: |
          python3 web/scripts/check.py
          python3 scripts/package-static-sites.py --output "$RUNNER_TEMP/static"
      - name: Attest package with GitHub OIDC
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/static/*.tar.gz
      - name: Keep the verification bundle beside the package
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/static/provenance.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/static/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: static-${{ github.event.workflow_run.head_sha }}
          path: candidate
      - name: Publish one immutable, CI-approved candidate
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            echo 'Main advanced; its newer CI run owns the next publication.'
            exit 0
          fi
          if gh release view "static-$SOURCE_SHA" >/dev/null 2>&1; then
            echo 'Immutable candidate already exists; never replace its assets.'
            exit 1
          fi
          gh release create "static-$SOURCE_SHA" candidate/* \
            --target "$SOURCE_SHA" --prerelease --latest=false \
            --title "Public sites $SOURCE_SHA" \
            --notes 'Attested landing and safe public admin placeholder. No operator preview, backend restart or proxy reload.'
