name: Native Linux release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated Linux artifacts (tag required)
        type: boolean
        default: false
  push:
    tags:
      - 'v*-native.*'
  pull_request:
    paths:
      - 'crates/tbg-client/**'
      - 'crates/tbg-core/**'
      - 'crates/tbg-update/**'
      - 'Cargo.*'
      - 'docs/patches/**'
      - 'scripts/check-patch-notes.py'
      - 'scripts/package-native.py'
      - 'scripts/install-linux.sh'
      - 'scripts/package-appimage.sh'
      - 'scripts/managed-bootstrap.sh'
      - '.github/workflows/native-release.yml'

concurrency:
  group: native-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      CARGO_BUILD_JOBS: 2
      TBG_DEFAULT_SERVER: wss://tbg.abastevo.com.br/ws
      TBG_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: native-linux
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev pkg-config patchelf desktop-file-utils file
      - name: Check the tag against the executable version
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/tbg-client/Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The release tag must match the client Cargo.toml version.' >&2
            exit 1
          fi
      - name: Build and test the native client
        run: |
          cargo test --locked -p tbg-client --bin tbg-client -- --test-threads=1
          cargo build --locked --release -p tbg-client
          target/release/tbg-client --version
      - name: Package Linux archive
        run: python3 scripts/package-native.py --platform linux --binary target/release/tbg-client
      - name: Package AppImage
        run: |
          curl --fail --location --retry 3 -o target/linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          echo '8aea8da0f7f7039d2a2cecb14657d752a222a5e1d3825caeef186c82f751cdd1  target/linuxdeploy.AppImage' | sha256sum --check --strict
          chmod +x target/linuxdeploy.AppImage
          bash scripts/package-appimage.sh target/linuxdeploy.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tupi-battle-grounds-linux-${{ github.sha }}
          path: |
            target/native/*.tar.gz
            target/native/*.AppImage
            target/native/*.sha256
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: linux
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tupi-battle-grounds-linux-${{ github.sha }}
          path: release
      - name: Publish a versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Refusing to report publication success for an existing immutable release. Use a fresh reviewed tag." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --title "Tupi Battle Grounds $GITHUB_REF_NAME · Linux" --notes-file deploy/native/RELEASE-NOTES.md
