name: Browser game release candidate

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-release-main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: 1.99.0

jobs:
  scope:
    # No pull-request build, fork, failed CI or stale main commit can publish.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deployable: ${{ steps.scope.outputs.deployable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select only browser game source
        id: scope
        # Compare with the last published candidate (read-only job token), so a
        # change skipped by an outdated run is still published by the next one.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/web-release-changes.py

  build:
    needs: [scope]
    if: needs.scope.outputs.deployable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TBG_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; compiler pinned by input
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: browser-wasm-release
      - name: Install pinned browser build tools
        run: bash scripts/install-web-build-tools.sh
      - name: Build the canonical contract and immutable browser URLs
        run: |
          contract=$(cargo run --quiet --locked -p tbg-core --example match-contract)
          echo "TBG_MATCH_CONTRACT=$contract" >> "$GITHUB_ENV"
          cd crates/tbg-client
          trunk build --release --skip-version-check --public-url "/releases/$TBG_SOURCE_COMMIT/"
      - name: Package the game only
        run: python3 scripts/package-web.py --contract "$TBG_MATCH_CONTRACT" --output "$RUNNER_TEMP/web"
      - name: Attest package with GitHub OIDC
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/web/*.tar.gz
      - name: Keep the verification bundle beside the package
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/web/provenance.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/web/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-${{ github.event.workflow_run.head_sha }}
          path: candidate
      - name: Publish one immutable, CI-approved candidate
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            echo 'Main advanced; its newer CI run owns the next publication.'
            exit 0
          fi
          if gh release view "web-$SOURCE_SHA" >/dev/null 2>&1; then
            echo 'Immutable candidate already exists; never replace its assets.'
            exit 1
          fi
          gh release create "web-$SOURCE_SHA" candidate/* \
            --target "$SOURCE_SHA" --prerelease --latest=false \
            --title "Browser game $SOURCE_SHA" \
            --notes 'CI-approved browser game candidate. Production verifies provenance and exact live match contract before atomic entry promotion. Existing tabs retain immutable assets. Admin, landing and mobile are excluded.'
