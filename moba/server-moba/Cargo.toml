# tbg-moba-server: authoritative 5v5 MOBA room server (Axum + Tokio WebSocket).
# Must never depend on Bevy or on the 1v1 crates.

[package]
name = "tbg-moba-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"

[lib]
name = "tbg_moba_server"
path = "src/lib.rs"

[[bin]]
name = "tbg-moba-server"
path = "src/main.rs"

[dependencies]
tbg-moba-core = { path = "../core-moba" }
# WebSocket upgrade and routing (same version as tbg-server).
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# Split each socket into an independent reader and writer task.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Structured logs.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Match seeds from the OS.
getrandom = "0.3"

[dev-dependencies]
# Real WebSocket client for the room integration test.
tokio-tungstenite = "0.29"
