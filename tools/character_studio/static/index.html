<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TBG Character Studio</title>
  <link rel="stylesheet" href="/css/studio.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar__inner">
        <div class="brand">
          <span class="brand__mark">TBG</span>
          <div>
            <h1>Character Studio</h1>
            <p class="brand__sub">Procedural &amp; mesh3d unit definitions</p>
          </div>
        </div>
        <nav class="topbar__nav">
          <a class="topbar__link topbar__link--active" href="/" aria-current="page">Studio</a>
          <a class="topbar__link" href="/showcase.html">Showcase</a>
        </nav>
        <span id="health" class="badge">checking</span>
      </div>
    </header>

    <main class="layout">
      <aside class="card panel panel--units">
        <header class="panel__head">
          <h2>Units</h2>
          <span id="unitCount" class="panel__meta">0 total</span>
        </header>
        <div id="charList" class="unit-list" role="list"></div>

        <div class="panel__section">
          <h2>New unit</h2>
          <div class="field">
            <label for="newId">Id</label>
            <input id="newId" class="input" placeholder="tank_human_02" autocomplete="off" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="newArchetype">Archetype</label>
              <select id="newArchetype" class="input"></select>
            </div>
            <div class="field">
              <label for="newFaction">Faction</label>
              <select id="newFaction" class="input"></select>
            </div>
          </div>
          <div class="field">
            <label for="newName">Display name</label>
            <input id="newName" class="input" placeholder="Iron Guard" autocomplete="off" />
          </div>
          <button class="btn btn--primary btn--block" id="btnCreate" type="button">Create unit</button>
        </div>
      </aside>

      <section class="card panel">
        <header class="panel__head">
          <h2>Edit</h2>
          <span id="editId" class="panel__meta">—</span>
        </header>

        <form id="editForm" class="form">
          <input type="hidden" id="id" />

          <div class="field">
            <label for="characterName">Display name</label>
            <input id="characterName" class="input" required />
          </div>

          <div class="field-row">
            <div class="field">
              <label for="archetype">Archetype</label>
              <select id="archetype" class="input"></select>
            </div>
            <div class="field">
              <label for="faction">Faction</label>
              <select id="faction" class="input"></select>
            </div>
          </div>

          <fieldset class="fieldset">
            <legend>Proportions</legend>
            <div class="field-row field-row--quad">
              <div class="field">
                <label for="heightScale">Height</label>
                <input id="heightScale" class="input" type="number" step="0.1" min="0.1" max="3" />
              </div>
              <div class="field">
                <label for="bodyWidthScale">Body</label>
                <input id="bodyWidthScale" class="input" type="number" step="0.1" min="0.1" max="3" />
              </div>
              <div class="field">
                <label for="headScale">Head</label>
                <input id="headScale" class="input" type="number" step="0.1" min="0.1" max="3" />
              </div>
              <div class="field">
                <label for="limbLengthScale">Limbs</label>
                <input id="limbLengthScale" class="input" type="number" step="0.1" min="0.1" max="3" />
              </div>
            </div>
          </fieldset>

          <fieldset class="fieldset">
            <legend>Colors</legend>
            <div class="field-row">
              <div class="field">
                <label for="primaryColor">Primary</label>
                <input id="primaryColor" class="input input--color" type="color" />
              </div>
              <div class="field">
                <label for="secondaryColor">Secondary</label>
                <input id="secondaryColor" class="input input--color" type="color" />
              </div>
            </div>
          </fieldset>

          <div class="field">
            <label for="evolutionStage">Evolution stage</label>
            <input id="evolutionStage" class="input" type="number" min="0" max="2" />
          </div>

          <fieldset id="mesh3dPanel" class="fieldset fieldset--mesh3d" hidden>
            <legend>Mesh3D</legend>
            <div class="field">
              <span class="field__label">Asset mode</span>
              <span id="assetModeBadge" class="unit-item__badge">procedural</span>
            </div>
            <div class="field">
              <span class="field__label">Mesh (.glb)</span>
              <a id="meshPathLink" class="mesh-link" href="#" target="_blank" rel="noopener">—</a>
            </div>
          </fieldset>

          <div class="form__actions">
            <button class="btn btn--primary" type="submit">Save &amp; export card</button>
            <button class="btn btn--ghost" id="btnDelete" type="button">Delete</button>
          </div>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="card panel panel--preview">
        <header class="panel__head panel__head--preview">
          <h2>Preview</h2>
          <div class="preview-tabs" role="tablist">
            <button type="button" class="preview-tabs__btn is-active" data-tab="viewport3d" role="tab">3D</button>
            <button type="button" class="preview-tabs__btn" data-tab="card" role="tab">Card</button>
          </div>
        </header>

        <div id="viewport3dPanel" class="preview preview--3d" role="tabpanel">
          <div id="viewer3dLoading" class="preview__loading" hidden>Loading 3D…</div>
          <div id="viewer3dEmpty" class="preview__empty">Select a unit to preview</div>
          <div id="viewer3d" class="viewer3d" hidden></div>
          <div class="viewer3d-controls" id="viewer3dControls" hidden>
            <label class="viewer3d-controls__toggle">
              <input type="checkbox" id="autoRotate" />
              Turntable
            </label>
            <button type="button" class="btn btn--ghost btn--sm" id="btnPlayIdle">Idle</button>
            <button type="button" class="btn btn--ghost btn--sm" id="btnPlayAttack">Attack</button>
            <button type="button" class="btn btn--ghost btn--sm" id="btnPlayDeath">Death</button>
          </div>
        </div>

        <div id="cardPanel" class="preview preview--card" role="tabpanel" hidden>
          <div id="previewEmpty" class="preview__empty">Select a unit to preview</div>
          <img id="cardPreview" class="preview__image" alt="Unit card preview" hidden />
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/js/studio/app.js"></script>
</body>
</html>
