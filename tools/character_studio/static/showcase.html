<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TBG Character Showcase</title>
  <link rel="stylesheet" href="/css/studio.css" />
  <link rel="stylesheet" href="/css/showcase.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="showcase-page">
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__mark">TBG</span>
        <div>
          <h1>Character Showcase</h1>
          <p class="brand__sub">Sculpt roster presentation</p>
        </div>
      </div>
      <nav class="topbar__nav">
        <a class="topbar__link" href="/">Studio</a>
        <a class="topbar__link topbar__link--active" href="/showcase.html" aria-current="page">Showcase</a>
        <a class="topbar__link" href="/animation-studio.html">Animation</a>
      </nav>
    </div>
  </header>

  <main class="showcase-main">
    <div class="showcase-toolbar">
      <p class="showcase-toolbar__hint">Two characters per slide — use arrows or swipe. Click a card for fullscreen 3D.</p>
      <div class="showcase-toolbar__controls">
        <button type="button" class="btn btn--ghost showcase-nav" id="btnPrev" aria-label="Previous slide">←</button>
        <span id="slideIndicator" class="showcase-indicator">1 / 1</span>
        <button type="button" class="btn btn--ghost showcase-nav" id="btnNext" aria-label="Next slide">→</button>
      </div>
    </div>

    <div class="showcase-viewport" id="showcaseViewport">
      <div class="showcase-track" id="showcaseTrack"></div>
    </div>
  </main>

  <div id="showcaseModal" class="showcase-modal" hidden>
    <div class="showcase-modal__backdrop" id="modalBackdrop"></div>
    <div class="showcase-modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button type="button" class="showcase-modal__nav showcase-modal__nav--prev" id="modalPrev" aria-label="Previous character">&lt;</button>
      <button type="button" class="showcase-modal__nav showcase-modal__nav--next" id="modalNext" aria-label="Next character">&gt;</button>
      <button type="button" class="showcase-modal__close" id="modalClose" aria-label="Close">×</button>
      <span id="modalCounter" class="showcase-modal__counter">1 / 1</span>
      <div id="modalLoading" class="showcase-modal__loading" hidden>Loading 3D…</div>
      <div id="modalViewer" class="showcase-modal__viewer"></div>
      <div class="showcase-modal__meta">
        <h2 id="modalTitle">—</h2>
        <p id="modalSubtitle" class="showcase-modal__sub">—</p>
      </div>
    </div>
  </div>

  <script type="module" src="/js/showcase/showcase.js"></script>
</body>
</html>
