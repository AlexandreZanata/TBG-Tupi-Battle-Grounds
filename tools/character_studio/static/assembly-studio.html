<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TBG Assembly Studio</title>
  <link rel="stylesheet" href="/css/studio.css" />
  <link rel="stylesheet" href="/css/assembly-studio.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar__inner">
        <div class="brand">
          <span class="brand__mark">TBG</span>
          <div>
            <h1>Assembly Studio</h1>
            <p class="brand__sub">Library → parts → export · Blender runs headless</p>
          </div>
        </div>
        <nav class="topbar__nav">
          <a class="topbar__link" href="/">Studio</a>
          <a class="topbar__link topbar__link--active" href="/assembly-studio.html" aria-current="page">Assembler</a>
        </nav>
        <span id="health" class="badge">checking</span>
      </div>
    </header>

    <main class="assembly-layout">
      <aside class="card panel">
        <header class="panel__head">
          <h2>Workflow</h2>
          <span id="assemblyStatus" class="panel__meta">Pick a base body</span>
        </header>
        <ol id="stepList" class="assembly-steps"></ol>
        <div class="assembly-export-bar">
          <button class="btn" id="btnPrev" type="button">Back</button>
          <button class="btn btn--primary" id="btnNext" type="button">Next</button>
        </div>
      </aside>

      <section class="card panel">
        <header class="panel__head">
          <h2>Preview</h2>
          <span class="panel__meta">Modular assembly</span>
        </header>
        <div id="viewport" class="assembly-viewport" aria-label="3D preview"></div>
      </section>

      <aside class="card panel">
        <header class="panel__head">
          <h2 id="stepTitle">Body</h2>
        </header>
        <div id="stepPanel"></div>
      </aside>
    </main>
  </div>

  <script type="module" src="/js/assembly-studio/assemblyApp.js"></script>
</body>
</html>
